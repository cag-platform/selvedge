<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      THE CARD LIVES HERE, NOT IN REACT.

      Slack, X, and iMessage fetch this file and never run the JavaScript, so a
      tag written by a component is invisible to every one of them. The landing
      is the root URL, and every other route is behind auth where there is
      nothing a stranger could be shown — so one static card is not a
      compromise, it is the whole honest surface. The tab title per authed
      route is set by the app (components/Head.tsx), which is the half that
      genuinely needs to run.
    -->
    <title>Selvedge — The permanent home for AI-built projects</title>
    <meta
      name="description"
      content="Bring in an AI-built project or start one here. Keep its code, context, agents, previews, and production state together."
    />
    <link rel="canonical" href="https://tryselvedge.com/" />

    <!-- Favicon: SVG (theme-aware via media), PNG fallbacks, app + apple icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0F1B2D" />

    <!-- Social card -->
    <meta property="og:title" content="Selvedge keeps your work from unraveling." />
    <meta
      property="og:description"
      content="A permanent home for AI-built projects—from first build to production."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tryselvedge.com" />
    <meta property="og:image" content="https://tryselvedge.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- What a screen reader announces in a feed, and what shows if the image
         404s after a deploy. -->
    <meta
      property="og:image:alt"
      content="Selvedge, the permanent home for projects built with AI."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Selvedge keeps your work from unraveling." />
    <meta
      name="twitter:description"
      content="A permanent home for AI-built projects—from first build to production."
    />
    <meta name="twitter:image" content="https://tryselvedge.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
